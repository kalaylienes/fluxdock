name: CI

on:
  push:
    branches: [main]
  pull_request:

# A second push to the same branch makes the first run pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend
    # Windows, not Linux. Part of the suite measures whether the numbers still
    # fit their cells, and that depends on the font: without Segoe UI the
    # fallback is wider and "100%est*" overflows a box it fits on the machines
    # this widget actually runs on.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Install the browser
        run: npx playwright install chromium

      - name: Test
        run: npm test

      - name: The suite must leave the tree alone
        run: git diff --exit-code

  rust:
    name: Rust
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # The bundle embeds the built interface, so the Rust build needs dist/
      # to exist before it can compile at all.
      - run: npm ci
      - run: npm run build

      - name: Clippy
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

      - name: Test
        run: cargo test --manifest-path src-tauri/Cargo.toml --lib
